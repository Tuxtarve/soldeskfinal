apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-advisor
  namespace: ticketing
spec:
  schedule: "*/10 * * * *"

  # 이전 Job이 끝나지 않으면 다음 실행 금지
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # ❗ 실행시간 부족 해결 (기존 180 → 900)
      activeDeadlineSeconds: 900
      backoffLimit: 1

      template:
        spec:
          serviceAccountName: ai-advisor-sa
          restartPolicy: OnFailure

          containers:
            - name: ai-advisor
              image: 032098305878.dkr.ecr.ap-northeast-2.amazonaws.com/ticketing/ai-advisor:latest
              imagePullPolicy: Always

              env:
                # Gemini API 키
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ai-advisor-secrets
                      key: GEMINI_API_KEY

                # Slack (선택)
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: ai-advisor-secrets
                      key: SLACK_WEBHOOK_URL
                      optional: true

                # ❗ WIF 사용 → JSON 인증 제거
                # (GOOGLE_APPLICATION_CREDENTIALS 삭제됨)

                # GCP 설정
                - name: GCP_PROJECT_ID
                  value: "soldesk-gcp"

                # AWS 리전
                - name: AWS_REGION
                  value: "ap-northeast-2"

                # Prometheus 내부 접근
                - name: PROMETHEUS_URL
                  value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"

              
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"

          