apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-advisor
  namespace: ticketing
spec:
  schedule: "*/1 * * * *"

  # 이전 Job이 끝나지 않으면 다음 실행 금지
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1

      template:
        spec:
          serviceAccountName: ai-advisor-sa
          restartPolicy: OnFailure

          # gcp-credential-config ConfigMap을 /etc/gcp/config.json 으로 마운트
          # (setup-gcp.sh step[6]이 생성, WIF 인증에 필수)
          volumes:
            - name: gcp-credential-config
              configMap:
                name: gcp-credential-config

          containers:
            - name: ai-advisor
              image: 032098305878.dkr.ecr.ap-northeast-2.amazonaws.com/ticketing/ai-advisor:latest
              imagePullPolicy: Always

              volumeMounts:
                - name: gcp-credential-config
                  mountPath: /etc/gcp
                  readOnly: true

              env:
                # Gemini API 키
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ai-advisor-secrets
                      key: GEMINI_API_KEY

                # Slack (선택)
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: ai-advisor-secrets
                      key: SLACK_WEBHOOK_URL
                      optional: true

                # WIF 자격증명 파일 경로 (ConfigMap 마운트 경로와 일치)
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: "/etc/gcp/config.json"

                # GCP 설정
                - name: GCP_PROJECT_ID
                  value: "soldesk-gcp"

                # AWS 리전
                - name: AWS_REGION
                  value: "ap-northeast-2"

                # 자동 패치 안전 스위치
                # "true" = 실제 변경 없이 로그만 출력 (테스트/검증용)
                # "false" = GitHub 커밋 → ArgoCD 자동 적용
                - name: AI_PATCH_DRY_RUN
                  value: "false"

                # GitHub GitOps 패치용 (Fine-grained PAT: Contents write 권한)
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ai-advisor-secrets
                      key: GITHUB_TOKEN
                - name: GITHUB_REPO
                  value: "Tuxtarve/soldeskfinal"
                - name: GITHUB_BRANCH
                  value: "FINAL"

                # 피크 모드 전환 기준 (SQS 대기 메시지 수)
                - name: PEAK_SQS_THRESHOLD
                  value: "100"
                - name: NORMAL_INTERVAL_MIN
                  value: "10"

                # Prometheus 내부 접근
                - name: PROMETHEUS_URL
                  value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"

              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
