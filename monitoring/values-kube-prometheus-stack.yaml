# -------------------------------------------------------
# kube-prometheus-stack  Helm values
# Target nodes: t3.small (2 vCPU / 2 GiB) -- keep lightweight
# -------------------------------------------------------

# ── Prometheus ─────────────────────────────────────────
prometheus:
  prometheusSpec:
    priorityClassName: ticketing-priority-platform
    # t3.small 경량화: 15d→5d 로 TSDB 크기·메모리 대폭 절감
    retention: 5d
    # 30s 스크레이프로 샘플 수 절반 감소 → 메모리·CPU 추가 절감
    scrapeInterval: 30s
    scrapeTimeout: 25s
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # 실사용 494Mi(retention 15d 기준) → 5d + 30s 간격 적용 시 ~280Mi 예상
    resources:
      requests:
        cpu: 80m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

    # EKS service scrape configs (app endpoints in ticketing namespace)
    additionalScrapeConfigs:
      - job_name: 'read-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [ticketing]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: read-api
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep

      - job_name: 'write-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [ticketing]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: write-api
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep

      - job_name: 'worker-svc'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [ticketing]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: worker-svc
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep

      # CloudWatch exporter (runs as a k8s Deployment in monitoring ns)
      - job_name: 'cloudwatch-exporter'
        static_configs:
          - targets: ['cloudwatch-exporter:9106']
        scrape_interval: 60s

      # Redis exporter
      - job_name: 'redis-exporter'
        static_configs:
          - targets: ['redis-exporter:9121']

# ── Grafana ────────────────────────────────────────────
grafana:
  priorityClassName: ticketing-priority-platform
  adminUser: root
  adminPassword: soldesk1.
  env:
    TZ: Asia/Seoul
  defaultDashboardsTimezone: Asia/Seoul
  # RWO PVC(gp3 EBS) 라 RollingUpdate 시 Multi-Attach 데드락. 새 파드는 구 파드가 완전히 사라져야 마운트 가능.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  service:
    type: ClusterIP

  # readiness probe: 기본 timeout=1s 는 t3.small SQLite 부하 시 너무 짧아 503 반복.
  # timeout 10s / failureThreshold 6 으로 여유 확보.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 6

  # Loki datasource
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      uid: loki
      editable: false

  # sidecar가 /tmp/dashboards 에 쓰고, provider 도 같은 경로를 읽도록 맞춤.
  # 기존 /var/lib/grafana/dashboards/default 는 sidecar mount 경로와 불일치 →
  # "no such file or directory" 에러 루프 → SQLite 경합 악화.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folder: /tmp/dashboards

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /tmp/dashboards

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
    date_formats:
      default_timezone: Asia/Seoul
    dataproxy:
      # 무거운 Prometheus 쿼리가 Grafana를 블로킹하지 않도록 타임아웃 설정
      timeout: 300
      keep_alive_seconds: 300
    database:
      # SQLite WAL 모드 — 읽기/쓰기 동시 접근 시 SQLITE_BUSY 방지
      wal: true
    feature_toggles:
      # Grafana 13 secure values API가 K8s Lease 호출 타임아웃 → SQLite 경합.
      # 실험적 기능 비활성화.
      grafanaAPIServerWithExperimentalAPIs: false

# ── AlertManager ───────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    priorityClassName: ticketing-priority-platform
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'slack'
      routes:
        - match:
            severity: critical
          receiver: 'slack'
          repeat_interval: 15m
    receivers:
      - name: 'slack'
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            send_resolved: true
            channel: '#alerts'
            title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            text: "{{ range .Alerts }}{{ .Annotations.description }}\n🕐 발생: {{ .StartsAt.In (\"Asia/Seoul\") }}\n{{ end }}"
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname']

# ── Node Exporter ──────────────────────────────────────
# 활성화 시 DaemonSet 이 모든 노드에 뜨며 node_cpu_*/node_memory_*/node_filesystem_*
# 메트릭 제공. 그래프 1860("Node Exporter Full") / 빌트인 "Node Exporter / Nodes"
# 등 Node 레벨 대시보드가 값을 채우려면 필수.
nodeExporter:
  enabled: true

# ── kube-state-metrics ─────────────────────────────────
# 활성화 시 kube_pod_* / kube_deployment_* / kube_node_* 메트릭 제공.
# "Kubernetes / Views / Nodes", "Kubernetes / Views / Pods" 같은 cluster-wide
# 대시보드에서 cluster/node/pod dropdown 을 채우려면 필수.
kubeStateMetrics:
  enabled: true

# ── EKS managed control-plane 컴포넌트 비활성화 ─────────
# EKS 는 etcd / kube-scheduler / kube-controller-manager 를 AWS 가 관리하는 영역에서
# 돌리며 고객 VPC 에서 metrics endpoint 접근이 불가능하다(AWS 정책상 비공개).
# 아래 3개를 기본값(true) 으로 두면 Prometheus Operator 가 ServiceMonitor/Service 는
# 만드는데 실제 endpoint 가 없어 target 자체가 비고, Grafana 의
# "Kubernetes / etcd / Scheduler / Controller Manager" 대시보드가 전부 No data 로 뜸.
# defaultRules.rules.* 도 함께 꺼서 항상 fire 하는 가짜 etcdDown / kubeSchedulerDown
# 알림이 울리지 않도록 한다.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

# ── Prometheus Operator ────────────────────────────────
prometheusOperator:
  priorityClassName: ticketing-priority-platform
  # 실사용 3m/20Mi — 과다 requests 축소.
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ── 서브차트(node-exporter/kube-state-metrics)도 플랫폼 우선순위로 ───────
# 실사용이 작으나 requests 없으면 BestEffort QoS 라 노드 압박 시 먼저 evict.
# 작은 값이라도 명시해 Burstable QoS + 스케줄링 예측성 확보.
prometheus-node-exporter:
  priorityClassName: ticketing-priority-platform
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
kube-state-metrics:
  priorityClassName: ticketing-priority-platform
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi
